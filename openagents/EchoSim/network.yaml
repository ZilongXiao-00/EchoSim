network:
  name: Mirrorswarm-network
  mode: centralized
  node_id: EchoSim
  transports:
  - type: http
    config:
      port: 8700
      serve_studio: true
      serve_mcp: true
      serve_a2a: true
  - type: grpc
    config:
      port: 8600
      max_message_size: 104857600
      compression: gzip
      keepalive_time: 60000
      keepalive_timeout: 30000
  - type: a2a
    config:
      port: null
      agent:
        name: Mirrorswarm-network
        description: Multi-agent chatroom with A2A support
  manifest_transport: http
  recommended_transport: grpc
  encryption_enabled: false
  discovery_interval: 10
  discovery_enabled: true
  max_connections: 20
  connection_timeout: 30.0
  retry_attempts: 3
  heartbeat_interval: 60
  agent_timeout: 180
  message_queue_size: 1000
  message_timeout: 30.0
  message_routing_enabled: true
  default_agent_group: guest
  requires_password: false
  agent_groups:
    admin:
      description: Administrator agents with full permissions
      metadata:
        permissions:
        - all
      password_hash: ef797c8118f02dfb649607dd5d3f8c7623048c9c063d532cc95c5ed7a898a64f
  mods: 
    - name: openagents.mods.workspace.messaging 
      enabled: true
      config:
        default_channels:
          - name: general
            description: General chat
          - name: survey-requests
            description: User requests survey topics here. Monitored by Agent A.
          - name: persona-db
            description: "Survey workspace: Agent A posts [SURVEY_TASK_INIT]; Agent E audits and posts [SURVEY_APPROVED]/[SURVEY_REJECTED]; Agent B posts [PERSONA_BATCH_READY];Agent F listens here to store personas into long-term memory."
          - name: field-work
            description: Agent C posts simulated answers here (per persona JSON) and [SIMULATION_COMPLETE].
          - name: insight-reports
            description: Agent D posts final analysis report here (Markdown).
  
  initialized: true
  created_by_version: 0.8.5

network_profile:
  name: Mirrorswarm network
  description: >
    Mirrorswarm is a multi-agent simulation network designed for end-to-end synthetic
    user research workflows. The system orchestrates a full pipeline including:
    survey task initialization, audit and approval, persona generation, parallel
    response simulation, long-term persona memory management, and automated insight
    analysis. Each agent operates under strict trigger-based contracts to prevent
    cross-talk, ensuring deterministic, reproducible, and scalable research
    simulations.
  tags:
    - simulation
    - multi-agent
    - survey
    - persona
    - memory
    - analytics

  categories:
    - collaboration
    - research
    - automation

  country: Worldwide
  capacity: 20
  authentication:
    type: none
  host: 0.0.0.0
  port: 8700

log_level: INFO
data_dir: ./data/mirrorswarm-network
runtime_limit: null
shutdown_timeout: 30
