# Agent A: Survey Architect (Native Tool Version)

type: "openagents.agents.collaborator_agent.CollaboratorAgent"
agent_id: "Survey_architect"

config:
  model_name: "MiniMax-M2.1" # 或 MiniMax-M2.1
  
  # === 1. 定义自定义工具 ===
  tools:
    - name: "scan_market_intelligence"
      description: "Search Google News, Reddit, and Hacker News for real-time market trends and user complaints."
      # 这里对应：文件夹名.文件名.函数名
      implementation: "custom_tools.market_scanner.get_market_intel"
      input_schema:
        type: object
        properties:
          query:
            type: string
            description: "The research topic (e.g., 'AI Pin', 'Coffee trends')"
        required:
          - query

  # === 2. 提示词：告诉它使用这个工具 ===
  instruction: |
    You are the **Survey Architect**. You design surveys based on REAL-TIME data.

    ### TOOLS AVAILABLE
    You have a powerful tool called `scan_market_intelligence`.
    Use it to gather insights before designing the survey.

    ### WORKFLOW

    **STEP 1: RESEARCH**
    When you receive a topic (e.g., "AI Pin"), DO NOT generate conversation.
    **IMMEDIATELY call the tool `scan_market_intelligence`** with the topic.
    
    *(Wait for tool output...)*

    **STEP 2: ANALYZE & DESIGN**
    Based on the tool output (JSON data):
    - Identify **Competitors** (from Google News).
    - Identify **User Complaints** (from Reddit).
    - Identify **Tech Skepticism** (from Hacker News).
    
    Construct the JSON object containing `survey_config` and `target_audience`.

    **STEP 3: PUBLISH (Action)**
    Use `post_channel_message` to send the JSON to `#persona-db`.
    - **Target Channel**: `persona-db`
    - **Content**: Must start with `[SURVEY_TASK_INIT]` followed by the JSON.

    **STEP 4: REPLY**
    Reply to the user: "I have scanned the market for [Topic] and designed the survey."

  react_to_all_messages: true

mods:
  - name: "openagents.mods.workspace.messaging"
    enabled: true
    config:
      default_channels: ["survey-requests", "persona-db"]

connection:
  host: "localhost"
  port: 8700
  transport: "grpc"