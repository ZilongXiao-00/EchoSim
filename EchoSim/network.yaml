network:
  name: mirrorswarm
  mode: centralized
  node_id: mirrorswarm-survey-net-1
  initialized: false
  transports:
  - type: http
    config:
      port: 8700
      serve_mcp: true
      serve_studio: true
      serve_a2a: true
  - type: grpc
    config:
      port: 8600
      max_message_size: 104857600
      compression: gzip
      keepalive_time: 60000
      keepalive_timeout: 30000
      keepalive_permit_without_calls: false
      max_connection_idle: 300000
      max_connection_age: 1800000
      http2_max_pings_without_data: 0
      http2_min_time_between_pings: 60000
      http2_min_ping_interval_without_data: 300000
  - type: mcp
    config:
      port: null
  - type: a2a
    config:
      port: null
      agent:
        name: DefaultNetwork
        description: OpenAgents default network with A2A support
  manifest_transport: http
  recommended_transport: grpc
  encryption_enabled: false
  discovery_interval: 10
  discovery_enabled: true
  max_connections: 500  # 增加连接数以支持并发Agent C
  connection_timeout: 30.0
  retry_attempts: 3
  heartbeat_interval: 60
  agent_timeout: 180
  message_queue_size: 5000 # 增加队列大小以处理批量问卷数据
  message_timeout: 30.0
  message_routing_enabled: true
  default_agent_group: guest
  requires_password: false
  
  # 1. Agent 分组：对应 A, B, C, D 四个角色
  agent_groups:
    architects:
      description: Agent A - Survey Architects. Responsible for requirement analysis and survey design.
      password_hash: 79dff3f691f7e6a1301bae5e62a094d77104680ba49624371f1353a138a1a683
      metadata:
        permissions:
        - create_projects
        - communicate_with_users
        - access_web_search
    generators:
      description: Agent B - Persona Factories. Responsible for batch generating user profiles.
      password_hash: e5a978ae4d92fe4786d6ecdb811e0723c5f585d782fbd9439be6510f06adca0e
      metadata:
        permissions:
        - execute_tasks
        - write_to_memory
    simulators:
      description: Agent C - Synthetic Respondents. High-concurrency agents for role-playing.
      password_hash: 8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918
      metadata:
        permissions:
        - execute_tasks
        - read_memory
        - submit_forms
    analysts:
      description: Agent D - Insight Hunters. Responsible for data ingestion and report generation.
      password_hash: 1a2b3c4d5e6f7g8h9i0j1k2l3m4n5o6p7q8r9s0t1u2v3w4x5y6z7a8b9c0d1e2f
      metadata:
        permissions:
        - access_files
        - run_code_interpreter
        - report_results

  mods:
  - name: openagents.mods.workspace.default
    enabled: true
    config:
      custom_events_enabled: true
      
  # 2. 定制通信频道：适应调研流程
  - name: openagents.mods.workspace.messaging
    enabled: true
    config:
      default_channels:
      - name: general
        description: General coordination channel
      - name: survey-requests
        description: Input channel for users to submit survey goals (Agent A)
      - name: persona-db
        description: Output channel for generated JSON personas (Agent B)
      - name: field-work
        description: High-traffic channel for simulation responses (Agent C)
      - name: insight-reports
        description: Final analysis reports delivery (Agent D)
      max_file_size: 52428800 # 增加到 50MB 以支持大型CSV/日志文件
      allowed_file_types:
      - txt
      - md
      - py
      - json
      - yaml
      - pdf
      - csv # 重点支持
      - xlsx # 重点支持
      file_storage_path: ./survey_data
      file_retention_days: 90
      max_message_history: 20000
      message_retention_days: 180
      

  # 4. 定制项目模板：定义 A->B->C->D 的工作流
  - name: openagents.mods.workspace.project
    enabled: true
    config:
      max_concurrent_projects: 10
      project_templates:
        synthetic_survey_pipeline:
          name: Synthetic User Survey
          description: End-to-end market research simulation workflow.
          agent_groups:
          - architects
          - generators
          - simulators
          - analysts
          context: |
            Workflow Definition:
            
            1. [Design Phase] Agent A (Architect) receives user intent, searches competitors, and outputs 'survey_config.json' and 'target_audience_def.json'.
            
            2. [Generation Phase] Agent B (Generator) reads 'target_audience_def.json' and produces a batch of Persona objects to the memory store.
            
            3. [Simulation Phase] Agent C (Simulator) instances are spawned. Each instance loads a Persona and the 'survey_config.json', then posts responses to the #field-work channel.
            
            4. [Analysis Phase] Agent D (Analyst) monitors #field-work completion, aggregates data, reads optional external CSVs, and executes Python code to generate the final report in #insight-reports.

        rapid_feedback_loop:
          name: Rapid App Store Analysis
          description: Quick analysis of existing reviews without simulation.
          agent_groups:
          - analysts
          context: |
             Workflow Definition:
             1. User uploads App Store export CSV to #insight-reports.
             2. Agent D (Analyst) automatically detects the file, performs sentiment analysis, and clusters pain points.
             

  created_by_version: 0.8.5

network_profile:
  discoverable: true
  name: mirrorswarm
  description: A specialized OpenAgents network for Synthetic User Research. It automates the generation of virtual personas, simulates survey responses, and mines insights from both synthetic and real-world data.
  tags:
  - market-research
  - simulation
  - synthetic-users
  - data-analysis
  - automation
  categories:
  - business
  - research
  - productivity
  country: Worldwide
  required_openagents_version: 0.7.4
  capacity: 500 # 增加容量
  authentication:
    type: none
  host: 0.0.0.0
  port: 8700
log_level: INFO
data_dir: ./data/survey-network
runtime_limit: null
shutdown_timeout: 30